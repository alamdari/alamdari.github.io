name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pushes that only touch assets/html/ get a fast deploy job; everything else still runs the full Jekyll build.
  filter:
    runs-on: ubuntu-latest
    outputs:
      non_assets_html: ${{ steps.paths.outputs.non_assets_html }}
      assets_html: ${{ steps.paths.outputs.assets_html }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            non_assets_html:
              - '**'
              - '!assets/html/**'
            assets_html:
              - 'assets/html/**'

  deploy:
    needs: filter
    if: |
      github.event_name != 'push' ||
      needs.filter.outputs.non_assets_html == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.2'
        bundler-cache: true
    - name: Update _config.yml ⚙️
      uses: fjogeleit/yaml-update-action@v0.13.1
      with:
        commitChange: false
        valueFile: '_config.yml'
        propertyPath: 'giscus.repo'
        value: ${{ github.repository }}
    - name: Install and Build 🔧
      run: |
        pip3 install --upgrade jupyter
        npm install -g mermaid.cli
        npm install -g purgecss
        export JEKYLL_ENV=production
        bundle exec jekyll build --lsi
        purgecss -c purgecss.config.js
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site

  deploy-assets-html:
    needs: filter
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.filter.outputs.non_assets_html != 'true' &&
      needs.filter.outputs.assets_html == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Stage assets/html for deploy
        run: |
          mkdir -p deploy/assets
          cp -R assets/html deploy/assets/
      - name: Deploy assets/html only (no full Jekyll build) 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          clean: false
          commit-message: Deploy assets/html only
